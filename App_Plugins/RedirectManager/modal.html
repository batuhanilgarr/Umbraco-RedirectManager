<div class="redirect-modal">
    <umb-box>
        <umb-box-content>
            <umb-control-group label="Status Code" description="Select the redirect type">
                <select ng-model="model.redirect.statusCode" class="umb-property-editor umb-dropdown">
                    <option value="301">301 - Permanent Redirect</option>
                    <option value="302">302 - Temporary Redirect</option>
                    <option value="404">404 - Not Found</option>
                    <option value="410">410 - Gone</option>
                </select>
            </umb-control-group>

            <umb-control-group label="Old URL" description="The URL path to redirect from (e.g., /old-page)" required="true">
                <input type="text"
                       ng-model="model.redirect.oldUrl"
                       class="umb-property-editor umb-textstring"
                       placeholder="/old-page"
                       required>
            </umb-control-group>

            <umb-control-group label="New URL"
                               description="The URL path to redirect to (required for 301/302)"
                               ng-if="model.redirect.statusCode == 301 || model.redirect.statusCode == 302">
                <input type="text"
                       ng-model="model.redirect.newUrl"
                       class="umb-property-editor umb-textstring"
                       placeholder="/new-page">
            </umb-control-group>

            <umb-control-group label="Active" description="Enable or disable this redirect">
                <umb-toggle checked="model.redirect.isActive"
                            on-click="model.redirect.isActive = !model.redirect.isActive">
                </umb-toggle>
            </umb-control-group>
        </umb-box-content>
    </umb-box>
</div>
