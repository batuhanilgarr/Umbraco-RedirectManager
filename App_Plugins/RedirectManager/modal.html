<div class="redirect-modal">
    <umb-box>
        <umb-box-content>
            <umb-control-group label="Status Code" description="Select the redirect type">
                <select ng-model="model.redirect.statusCode" class="umb-property-editor umb-dropdown">
                    <option value="301">301 - Permanent Redirect</option>
                    <option value="302">302 - Temporary Redirect</option>
                    <option value="404">404 - Not Found</option>
                    <option value="410">410 - Gone</option>
                </select>
            </umb-control-group>

            <umb-control-group label="Old URL"
                               description="The URL path to redirect from"
                               required="true">
                <input type="text"
                       ng-model="model.redirect.oldUrl"
                       class="umb-property-editor umb-textstring"
                       placeholder="/old-page"
                       required>
            </umb-control-group>

            <umb-control-group label="New URL"
                               description="The URL path to redirect to"
                               ng-if="model.redirect.statusCode == 301 || model.redirect.statusCode == 302">
                <input type="text"
                       ng-model="model.redirect.newUrl"
                       class="umb-property-editor umb-textstring"
                       placeholder="/new-page">
            </umb-control-group>

            <umb-control-group label="A/B test"
                               description="Split traffic between New URL and a second URL"
                               ng-if="(model.redirect.statusCode == 301 || model.redirect.statusCode == 302) && !model.redirect.isRegex">
                <umb-toggle checked="model.redirect.abTestEnabled"
                            on-click="model.redirect.abTestEnabled = !model.redirect.abTestEnabled">
                </umb-toggle>
            </umb-control-group>

            <umb-control-group label="Variant B URL"
                               description="Visitors assigned to Variant B go here instead of New URL"
                               ng-if="model.redirect.abTestEnabled && (model.redirect.statusCode == 301 || model.redirect.statusCode == 302) && !model.redirect.isRegex"
                               required="true">
                <input type="text"
                       ng-model="model.redirect.variantBUrl"
                       class="umb-property-editor umb-textstring"
                       placeholder="/new-page-variant-b">
            </umb-control-group>

            <umb-control-group label="Variant B weight"
                               description="% of visitors sent to Variant B. A visitor is assigned once (cookie) and always sees the same variant afterward."
                               ng-if="model.redirect.abTestEnabled && (model.redirect.statusCode == 301 || model.redirect.statusCode == 302) && !model.redirect.isRegex">
                <input type="number"
                       min="0" max="100"
                       ng-model="model.redirect.variantBWeight"
                       class="umb-property-editor umb-textstring">
            </umb-control-group>

            <umb-control-group label="Preserve query string"
                               description="Append the incoming request's query string (e.g. ?utm_source=...) to New URL"
                               ng-if="model.redirect.statusCode == 301 || model.redirect.statusCode == 302">
                <umb-toggle checked="model.redirect.preserveQueryString"
                            on-click="model.redirect.preserveQueryString = !model.redirect.preserveQueryString">
                </umb-toggle>
            </umb-control-group>

            <umb-control-group label="Domain"
                               description="Leave blank to apply this redirect to all domains. If both a domain-specific and an all-domains redirect exist for the same Old URL, the domain-specific one wins.">
                <input type="text"
                       ng-model="model.redirect.domain"
                       class="umb-property-editor umb-textstring"
                       placeholder="example.com">
            </umb-control-group>

            <umb-control-group label="Valid from"
                               description="Leave blank to make this redirect active immediately.">
                <input type="datetime-local"
                       ng-model="model.redirect.validFrom"
                       class="umb-property-editor umb-textstring">
            </umb-control-group>

            <umb-control-group label="Valid until"
                               description="Leave blank to keep this redirect active indefinitely.">
                <input type="datetime-local"
                       ng-model="model.redirect.validUntil"
                       class="umb-property-editor umb-textstring">
            </umb-control-group>

            <umb-control-group label="Notes"
                               description="Optional description to help identify the purpose of this redirect">
                <textarea ng-model="model.redirect.description"
                          rows="3"
                          class="umb-property-editor umb-textarea"
                          placeholder="Optional notes..."></textarea>
            </umb-control-group>

            <umb-control-group label="Active" description="Enable or disable this redirect">
                <umb-toggle checked="model.redirect.isActive"
                            on-click="model.redirect.isActive = !model.redirect.isActive">
                </umb-toggle>
            </umb-control-group>

            <umb-control-group label="Regex match"
                               description="If enabled, Old URL is treated as a regex pattern. For 301/302 you can use capture groups in New URL (e.g. $1).">
                <umb-toggle checked="model.redirect.isRegex"
                            on-click="model.redirect.isRegex = !model.redirect.isRegex">
                </umb-toggle>
            </umb-control-group>
        </umb-box-content>
    </umb-box>
</div>
