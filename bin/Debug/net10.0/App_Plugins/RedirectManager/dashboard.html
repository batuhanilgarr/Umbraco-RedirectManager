<div ng-controller="RedirectManager.DashboardController as vm">
    <umb-box>
        <umb-box-header title="Redirect Manager">
            <umb-button type="button"
                        button-style="success"
                        label="Add New Redirect"
                        action="vm.openAddModal()">
            </umb-button>
        </umb-box-header>
        <umb-box-content>
            <div ng-if="vm.loading" class="redirect-loading">
                <umb-load-indicator></umb-load-indicator>
            </div>

            <div ng-if="!vm.loading && vm.redirects.length === 0" class="redirect-empty">
                <p>No redirects found. Click "Add New Redirect" to create one.</p>
            </div>

            <table ng-if="!vm.loading && vm.redirects.length > 0" class="redirect-table">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Old URL</th>
                        <th>New URL</th>
                        <th>Status Code</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="redirect in vm.redirects">
                        <td>
                            <span class="redirect-status redirect-status-{{redirect.statusCode}}">
                                {{redirect.statusCode}}
                            </span>
                        </td>
                        <td class="redirect-url">{{redirect.oldUrl}}</td>
                        <td class="redirect-url">{{redirect.newUrl || '-'}}</td>
                        <td>{{vm.getStatusCodeLabel(redirect.statusCode)}}</td>
                        <td>
                            <span ng-class="{'redirect-active': redirect.isActive, 'redirect-inactive': !redirect.isActive}">
                                {{redirect.isActive ? 'Yes' : 'No'}}
                            </span>
                        </td>
                        <td class="redirect-actions">
                            <umb-button type="button"
                                        button-style="info"
                                        size="xs"
                                        label="Edit"
                                        action="vm.openEditModal(redirect)">
                            </umb-button>
                            <umb-button type="button"
                                        button-style="danger"
                                        size="xs"
                                        label="Delete"
                                        action="vm.deleteRedirect(redirect)">
                            </umb-button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </umb-box-content>
    </umb-box>

    <!-- Add/Edit Modal -->
    <umb-overlay ng-if="vm.showModal"
                 view="/App_Plugins/RedirectManager/modal.html"
                 model="vm.modalModel"
                 position="center"
                 size="small"
                 close="vm.closeModal()"
                 submit="vm.saveRedirect(model)">
    </umb-overlay>
</div>
